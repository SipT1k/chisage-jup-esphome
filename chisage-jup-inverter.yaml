  # ---- Аварії та попередження (загальні) ----
  - platform: template
    name: "Active Warnings Count"
    icon: mdi:counter
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(raw_alarm1).state) || std::isnan(id(raw_alarm2).state)) return {};
      return (float) (__builtin_popcount((uint16_t) id(raw_alarm1).state) + __builtin_popcount((uint16_t) id(raw_alarm2).state));
  - platform: template
    name: "Active Faults Count"
    icon: mdi:counter
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(raw_fault1).state) || std::isnan(id(raw_fault2).state)) return {};
      return (float) (__builtin_popcount((uint16_t) id(raw_fault1).state) + __builtin_popcount((uint16_t) id(raw_fault2).state));

  # ---- Діагностика ESP ----
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  # ---- Службові регістри (сирі слова; для text/binary-сенсорів і скриптів запису) ----
  - platform: modbus_controller
    modbus_controller_id: inv_fast
    id: raw_working_mode
    name: "Working Mode raw"
    address: 6
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    internal: true
  - platform: modbus_controller
    modbus_controller_id: dc_fast
    id: raw_machine_state
    name: "Machine State raw"
    address: 2058
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    internal: true
  - platform: modbus_controller
    modbus_controller_id: dc_fast
    id: raw_alarm1
    name: "Alarm word 1 raw"
    address: 2061
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    internal: true
  - platform: modbus_controller
    modbus_controller_id: dc_fast
    id: raw_alarm2
    name: "Alarm word 2 raw"
    address: 2062
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    internal: true
  - platform: modbus_controller
    modbus_controller_id: dc_fast
    id: raw_fault1
    name: "Fault word 1 raw"
    address: 2063
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    internal: true
  - platform: modbus_controller
