# ===========================================================================
#  SELECTS
# ===========================================================================
select:
  # Режим роботи (регістр 6, Table 2-1). Небезпечні режими Standby / DC / AC voltage source
  # навмисно не додані. Для Time of Use потрібен режим 6 або 10.
  - platform: modbus_controller
    modbus_controller_id: inv_fast
    name: "Working Mode Control"
    icon: mdi:cog-transfer
    address: 6
    value_type: U_WORD
    use_write_multiple: true
    entity_category: config
    optionsmap:
      "Power control": 4
      "Time-based power control": 6
      "Auto on/off-grid, power control": 8
      "Auto on/off-grid, time-based power control": 10

  # Режим віддачі в мережу (регістр 2083)
  - platform: modbus_controller
    modbus_controller_id: dc_tou
    name: "Grid Export Mode"
    icon: mdi:transmission-tower-export
    address: 2083
    value_type: U_WORD
    use_write_multiple: true
    entity_category: config
    disabled_by_default: true
    optionsmap:
      "Sell first": 1
      "Zero export to grid port": 2
      "Zero export to CT": 3

  # ---- Тип порту генератора (регістр 701, сторінка 8) ----
  - platform: template
    name: "Generator Port Type"
    icon: mdi:engine
    entity_category: config
    options: ["Generator", "Smart load", "AC couple"]
    update_interval: 10s
    lambda: |-
      float v = id(raw_gen_port).state;
      if (std::isnan(v)) return {};
      switch ((int) v) {
        case 0: return std::string("Generator");
        case 5: return std::string("Smart load");
        case 10: return std::string("AC couple");
        default: return {};
      }
    set_action:
      - script.execute:
          id: jup_write_gen_page
          idx: 0
          newval: !lambda 'return x == "Smart load" ? 5.0f : (x == "AC couple" ? 10.0f : 0.0f);'

  # ---- Режим AC Couple (регістр 705, сторінка 8): VF або PQ ----
  - platform: template
    name: "AC Couple Mode"
    icon: mdi:sine-wave
    entity_category: config
    disabled_by_default: true
    options: ["PQ", "VF"]
    update_interval: 10s
    lambda: |-
      float v = id(raw_gen_mode).state;
      if (std::isnan(v)) return {};
      return std::string(((int) v) == 5 ? "VF" : "PQ");
    set_action:
      - script.execute:
          id: jup_write_gen_page
          idx: 2
          newval: !lambda 'return x == "VF" ? 5.0f : 0.0f;'

  # ---- Тип батареї (регістр 2652, сторінка 1). Значення за таблицею "Parameter settings" ----
  - platform: template
    name: "Battery Type"
    icon: mdi:battery-unknown
    entity_category: config
    disabled_by_default: true
    options: ["Lithium", "Use battery voltage", "Use battery %"]
    update_interval: 60s
    lambda: |-
      float v = id(raw_bat_mode).state;
      if (std::isnan(v)) return {};
      switch ((int) v) {
        case 5: return std::string("Lithium");
        case 0: return std::string("Use battery voltage");
        case 80: return std::string("Use battery %");
        default: return {};
      }
    set_action:
      - script.execute:
          id: jup_write_batt_page
          idx: 9
          newval: !lambda 'return x == "Lithium" ? 5.0f : (x == "Use battery %" ? 80.0f : 0.0f);'


# ===========================================================================
#  DATETIME (Time of Use: початок і кінець слотів у форматі ГГ:ХХ)
# ===========================================================================
datetime:
  - platform: template
    type: time
    id: tou_time1
    name: "TOU Slot 1 End"
    icon: mdi:clock-outline
    entity_category: config
    update_interval: 5s
    lambda: |-
      float v = id(tou_t1).state;
      if (std::isnan(v)) return {};
      ESPTime t = {};
      t.hour = ((int) v) / 100;
      t.minute = ((int) v) % 100;
      t.second = 0;
      return t;
    set_action:
      - script.execute:
          id: jup_write_tou_page
          page: 4
          idx: 0
