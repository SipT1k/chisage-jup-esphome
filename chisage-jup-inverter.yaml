# ===========================================================================
#  BINARY SENSORS (біти статусних слів: Table 1-3 / 1-5)
# ===========================================================================
binary_sensor:

  # ---- PV (сонячні панелі) ----
  - platform: modbus_controller
    modbus_controller_id: inv_fast
    name: "PV1 Operating"
    address: 2
    register_type: holding
    bitmask: 0x0001
    device_class: running
  - platform: modbus_controller
    modbus_controller_id: inv_fast
    name: "PV2 Operating"
    address: 2
    register_type: holding
    bitmask: 0x0002
    device_class: running

  # ---- Батарея ----
  - platform: modbus_controller
    modbus_controller_id: dc_fast
    name: "BMS Charge Enabled"
    address: 2014
    register_type: holding
    bitmask: 0x8000
    disabled_by_default: true
  - platform: modbus_controller
    modbus_controller_id: dc_fast
    name: "BMS Discharge Enabled"
    address: 2014
    register_type: holding
    bitmask: 0x4000
    disabled_by_default: true
  - platform: modbus_controller
    modbus_controller_id: dc_fast
    name: "BMS Communication OK"
    address: 2014
    register_type: holding
    bitmask: 0x0100
    device_class: connectivity
    entity_category: diagnostic
    disabled_by_default: true

  # ---- Мережа (Grid) ----
  - platform: modbus_controller
    modbus_controller_id: inv_fast
    name: "Grid Relay Closed"
    address: 2
    register_type: holding
    bitmask: 0x8000
  - platform: template
    name: "Grid Present"
    device_class: power
    lambda: |-
      if (std::isnan(id(grid_voltage_v).state)) return {};
      return id(grid_voltage_v).state >= ${ac_present_voltage};

  # ---- Генератор ----
  - platform: modbus_controller
    modbus_controller_id: inv_fast
    name: "Generator Relay Closed"
    address: 2
    register_type: holding
    bitmask: 0x0800
  - platform: template
    name: "Generator Present"
    device_class: power
    lambda: |-
      if (std::isnan(id(generator_voltage_v).state)) return {};
      return id(generator_voltage_v).state >= ${ac_present_voltage};

  # ---- Навантаження (Load / UPS / Smart / Home) ----
  - platform: modbus_controller
    modbus_controller_id: inv_fast
    name: "Smart Load On"
    address: 2
    register_type: holding
    bitmask: 0x0200

  # ---- Інвертор (стан, температури, діагностика) ----
  - platform: modbus_controller
    modbus_controller_id: inv_fast
    name: "DC Normal Operation"
    address: 2
    register_type: holding
    bitmask: 0x0020
    device_class: running
  - platform: modbus_controller
    modbus_controller_id: inv_fast
    name: "Inverter Module Online"
    address: 90
    register_type: holding
    bitmask: 0x0001
    device_class: connectivity
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: dc_fast
    name: "DC Module Online"
    address: 2090
    register_type: holding
    bitmask: 0x0001
    device_class: connectivity
    entity_category: diagnostic

  # ---- Аварії та попередження (загальні) ----
  - platform: template
    name: "Warning Active"
    device_class: problem
    lambda: |-
      if (std::isnan(id(raw_alarm1).state) || std::isnan(id(raw_alarm2).state)) return {};
      return (((uint16_t) id(raw_alarm1).state) | ((uint16_t) id(raw_alarm2).state)) != 0;
  - platform: template
    name: "Fault Active"
    device_class: problem
    lambda: |-
      if (std::isnan(id(raw_fault1).state) || std::isnan(id(raw_fault2).state)) return {};
      return (((uint16_t) id(raw_fault1).state) | ((uint16_t) id(raw_fault2).state)) != 0;


# ===========================================================================
#  TEXT SENSORS
# ===========================================================================
text_sensor:

  # ---- PV (сонячні панелі) ----
  - platform: template
    name: "PV Status"
    icon: mdi:solar-panel
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(raw_sw3).state)) return {};
      static const char *const T0[16] = {"PV1 low voltage", nullptr, "PV2 low voltage", "PV hardware overcurrent", "PV1 overvoltage", nullptr, nullptr, "PV2 overvoltage", nullptr, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr};
      const uint16_t w[1] = {(uint16_t) id(raw_sw3).state};
      const char *const *T[1] = {T0};
      std::string out;
      for (int k = 0; k < 1; k++) {
        for (int b = 0; b < 16; b++) {
          if (((w[k] >> b) & 1) == 0 || T[k][b] == nullptr) continue;
          if (!out.empty()) out += ", ";
          out += T[k][b];
        }
      }
      if (out.empty()) return std::string("Normal");
      if (out.size() > 250) out = out.substr(0, 247) + "...";
      return out;

  # ---- Батарея ----
  - platform: template
    name: "Battery Faults"
    icon: mdi:battery-alert
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(raw_sw1).state)) return {};
      static const char *const T0[16] = {"Battery low voltage", "Battery overvoltage", nullptr, "DC hardware overcurrent", nullptr, nullptr, "Low-voltage DC overvoltage", nullptr, "Bus overvoltage 1", "Bus undervoltage", nullptr, "DC hardware overcurrent 1", "Bus overvoltage 2", nullptr, nullptr, nullptr};
      const uint16_t w[1] = {(uint16_t) id(raw_sw1).state};
      const char *const *T[1] = {T0};
      std::string out;
      for (int k = 0; k < 1; k++) {
        for (int b = 0; b < 16; b++) {
          if (((w[k] >> b) & 1) == 0 || T[k][b] == nullptr) continue;
          if (!out.empty()) out += ", ";
          out += T[k][b];
        }
      }
      if (out.empty()) return std::string("No faults");
      if (out.size() > 250) out = out.substr(0, 247) + "...";
      return out;

  # ---- Мережа (Grid) ----
  - platform: template
    name: "Grid Faults"
    icon: mdi:transmission-tower-off
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(grid_voltage_v).state)) return {};
      auto u = [](sensor::Sensor *s) -> uint16_t { return std::isnan(s->state) ? 0 : (uint16_t) s->state; };
      std::string out;
      auto add = [&](bool c, const char *t) { if (c) { if (!out.empty()) out += ", "; out += t; } };
      const uint16_t s4 = u(id(raw_sw4));
      const uint16_t a1 = u(id(raw_alarm1)), a2 = u(id(raw_alarm2)), f2 = u(id(raw_fault2));
      (void) s4; (void) a1; (void) a2; (void) f2;
      if (id(grid_voltage_v).state < ${ac_present_voltage}) return std::string("No grid");
      add((s4 & 0x2000) != 0, "Anti-islanding frequency anomaly");
      add((s4 & 0x0020) != 0, "Anti-islanding frequency anomaly");
      add((s4 & 0x0400) != 0, "Grid frequency abnormal");
      add((s4 & 0x0200) != 0, "Grid voltage amplitude abnormal");
      // Напруга мережі - лише за прапорцями інвертора, без порівняння з виміряною напругою.
      // Біт 7 (W08) = занижена напруга; біт 15 (W16) = вихід за межі в будь-який бік (напрямок невідомий).
      // Якщо встановлені обидва, показуємо точніший "Grid low voltage", щоб не дублювати.
      const bool v_low = (a1 & 0x0080) != 0;
      add(v_low, "Grid low voltage");
      add(!v_low && (a1 & 0x8000) != 0, "Grid over/under voltage");
      add((a2 & 0x0001) != 0, "Grid phase sequence error");
      add((a2 & 0x0002) != 0, "Grid over/under frequency");
      add((f2 & 0x0080) != 0, "Grid current overload");
      add((f2 & 0x0800) != 0, "AC backfeed");
      if (out.empty()) return std::string("No faults");
      if (out.size() > 250) out = out.substr(0, 247) + "...";
      return out;

  # ---- Генератор ----
  - platform: template
    name: "Generator Faults"
    icon: mdi:engine-off
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(generator_voltage_v).state)) return {};
      auto u = [](sensor::Sensor *s) -> uint16_t { return std::isnan(s->state) ? 0 : (uint16_t) s->state; };
      std::string out;
      auto add = [&](bool c, const char *t) { if (c) { if (!out.empty()) out += ", "; out += t; } };
      const uint16_t s4 = u(id(raw_sw4));
      const uint16_t a1 = u(id(raw_alarm1)), a2 = u(id(raw_alarm2)), f2 = u(id(raw_fault2));
      (void) s4; (void) a1; (void) a2; (void) f2;
      if (id(generator_voltage_v).state < ${ac_present_voltage}) return std::string("No generator");
      add((s4 & 0x0004) != 0, "Generator frequency abnormal");
      add((s4 & 0x0002) != 0, "Generator voltage amplitude abnormal");
      add((a1 & 0x0100) != 0, "Generator low voltage");
      add((a2 & 0x0004) != 0, "Generator over/under voltage");
      add((a2 & 0x0008) != 0, "Generator phase sequence error");
      add((a2 & 0x0010) != 0, "Generator over/under frequency");
      add((f2 & 0x0100) != 0, "Generator current overload");
      if (out.empty()) return std::string("No faults");
      if (out.size() > 250) out = out.substr(0, 247) + "...";
      return out;

  # ---- Інвертор (стан, температури, діагностика) ----
  - platform: template
    name: "Working Mode"
    update_interval: 10s
    lambda: |-
      float v = id(raw_working_mode).state;
      if (std::isnan(v)) return {};
      switch ((int) v) {
        case 0: return std::string("Standby");
        case 1: return std::string("DC voltage source");
        case 2: return std::string("AC voltage source");
        case 4: return std::string("Power control");
        case 6: return std::string("Time-based power control");
        case 7: return std::string("PQ run");
        case 8: return std::string("Auto on/off-grid, power control");
        case 10: return std::string("Auto on/off-grid, time-based power control");
        default: return std::string("Mode ") + std::to_string((int) v);
      }
  - platform: template
    name: "Machine State"
    update_interval: 10s
    lambda: |-
      float v = id(raw_machine_state).state;
      if (std::isnan(v)) return {};
      switch ((int) v) {
        case 0: return std::string("Standby");
        case 1: return std::string("Self-test");
        case 2: return std::string("Normal");
        case 3: return std::string("Alarm");
        case 4: return std::string("Fault");
        case 5: return std::string("Shutdown");
        default: return std::string("State ") + std::to_string((int) v);
      }
  - platform: template
    name: "Inverter Clock"
    icon: mdi:clock-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      sensor::Sensor *c[6] = {id(raw_clk_year), id(raw_clk_month), id(raw_clk_day),
                              id(raw_clk_hour), id(raw_clk_min), id(raw_clk_sec)};
      int v[6];
      for (int i = 0; i < 6; i++) {
        if (std::isnan(c[i]->state)) return {};
        v[i] = (int) c[i]->state;
      }
      char buf[32];
      snprintf(buf, sizeof(buf), "20%02d-%02d-%02d %02d:%02d:%02d", v[0], v[1], v[2], v[3], v[4], v[5]);
      return std::string(buf);
  - platform: template
    name: "Inverter Faults"
    icon: mdi:flash-alert
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(raw_sw0).state)) return {};
      static const char *const T0[16] = {"Load voltage abnormal", "Bus overvoltage", "AC software overcurrent", "AC hardware overcurrent", "Over temperature", "Phase lock abnormal", nullptr, "Self-test failed", nullptr, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr, nullptr};
      const uint16_t w[1] = {(uint16_t) id(raw_sw0).state};
      const char *const *T[1] = {T0};
      std::string out;
      for (int k = 0; k < 1; k++) {
        for (int b = 0; b < 16; b++) {
          if (((w[k] >> b) & 1) == 0 || T[k][b] == nullptr) continue;
          if (!out.empty()) out += ", ";
          out += T[k][b];
        }
      }
      if (out.empty()) return std::string("No faults");
      if (out.size() > 250) out = out.substr(0, 247) + "...";
      return out;

  # ---- Аварії та попередження (загальні) ----
  - platform: template
    name: "Active Faults"
    icon: mdi:alert-octagon
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(raw_fault1).state) || std::isnan(id(raw_fault2).state)) return {};
      static const char *const T0[16] = {"Battery reverse polarity", "Permanent insulation resistance failure", "EEPROM read error", "EEPROM write error", "Battery soft start failed", "DC hardware overcurrent", "DC software overcurrent", "Auxiliary power supply failure", "IGBT fault", "Fault word 1 bit 9 (reserved)", "AC main contactor error", "AC auxiliary contactor error", "AC hardware overcurrent", "AC software overcurrent", "GFCI (RCD) leakage current", "Three-phase overcurrent"};
      static const char *const T1[16] = {"DC bus unbalance", "Load over/under voltage", "Fault word 2 bit 2 (reserved)", "Fault word 2 bit 3 (reserved)", "Fault word 2 bit 4 (reserved)", "Fault word 2 bit 5 (reserved)", "Fault word 2 bit 6 (reserved)", "Grid current overload", "Generator current overload", "DC bus overvoltage", "DC bus undervoltage", "AC backfeed", "Heatsink over-temperature", "PV arc fault", "PV1 reverse connection", "PV2 reverse connection"};
      const uint16_t w[2] = {(uint16_t) id(raw_fault1).state, (uint16_t) id(raw_fault2).state};
      const char *const *T[2] = {T0, T1};
      std::string out;
      for (int k = 0; k < 2; k++) {
        for (int b = 0; b < 16; b++) {
          if (((w[k] >> b) & 1) == 0 || T[k][b] == nullptr) continue;
          if (!out.empty()) out += ", ";
          out += T[k][b];
        }
      }
      if (out.empty()) return std::string("No faults");
      if (out.size() > 250) out = out.substr(0, 247) + "...";
      return out;


# ===========================================================================
#  SCRIPTS (запис параметрів)
# ===========================================================================
script:
  # Сторінка параметрів №3 (мережа/генератор: ліміти заряду та розряду).
  # Інвертор приймає сторінку ЦІЛКОМ: K0 (=номер сторінки) + K1..K13 одним записом
  # у регістри 5000..5013. Тому змінюємо одне значення, решту беремо з поточних.
  - id: jup_write_grid_page
    mode: queued
    parameters:
      idx: int
      newval: float
    then:
      - lambda: |-
          static const float scale[13] = {1.0f, 1.0f, 1.0f, 0.01f, 0.01f, 0.1f, 0.1f,
                                          1.0f, 1.0f, 1.0f, 0.01f, 0.01f, 1.0f};
          if (idx < 0 || idx > 12) return;
          float cur[13] = {
            id(p3_grid_dis_pmax).state, id(p3_grid_dis_soc_min).state, id(p3_grid_chg_soc_max).state,
            id(p3_grid_dis_vmin).state, id(p3_grid_chg_vmax).state, id(p3_grid_chg_imax).state,
            id(p3_gen_chg_imax).state, id(p3_gen_dis_pmax).state, id(p3_gen_dis_soc_min).state,
            id(p3_gen_chg_soc_max).state, id(p3_gen_dis_vmin).state, id(p3_gen_chg_vmax).state,
            id(p3_grid_chg_prohibit_soc).state
          };
          cur[idx] = newval;
          uint16_t regs[14];
          regs[0] = 3;  // K0 = номер сторінки
          for (int i = 0; i < 13; i++) {
            if (std::isnan(cur[i])) {
              ESP_LOGW("jup", "Page 3 not fully read yet (param %d) - write skipped", i + 1);
              return;
            }
            regs[i + 1] = (uint16_t) lroundf(cur[i] / scale[i]);
          }
          ESP_LOGI("jup", "Writing page 3: K%d = %.2f", idx + 1, newval);
          id(jup_dc_writer).write_multiple_registers(5000, regs);

  # Запис прапорців у спільні слова 2732 (генератор) / 2733 (мережа):
  # читаємо поточне слово, міняємо лише потрібні біти, пишемо назад.
  - id: jup_write_ctrl_word
    mode: queued
    parameters:
      addr: int
      mask: int
      value: int
    then:
      - lambda: |-
          sensor::Sensor *src = (addr == 2732) ? id(raw_gen_ctrl) : id(raw_grid_ctrl);
          if (std::isnan(src->state)) {
            ESP_LOGW("jup", "Control word %d not read yet - write skipped", addr);
            return;
          }
          uint16_t cur = (uint16_t) src->state;
          uint16_t v = (uint16_t) ((cur & ~((uint16_t) mask)) | ((uint16_t) value));
          uint16_t regs[1] = {v};
          ESP_LOGI("jup", "Reg %d: 0x%04X -> 0x%04X", addr, cur, v);
          id(jup_dc_writer).write_multiple_registers(addr, regs);
          src->publish_state(v);


  # Time of Use, сторінки 4 (SOC) / 5 (Voltage) / 6 (Power).
  # Інвертор приймає сторінку ЦІЛКОМ: K0 (=номер сторінки) + K1..K20 одним записом
  # у регістри 5000..5020:  K1..K8 = час переходів (HHMM), K9..K17 = значення 9 слотів,
  # K18 = Time of Use enable (5/0), K19 = grid charge flag, K20 = generator charge flag.
  # Час і прапорці спільні для всіх трьох сторінок; значення слотів - свої на кожну сторінку.
  # K19 / K20 - бітові маски: біт 0..8 = дозвіл заряду від мережі / генератора для слотів 1..9.
  # idx: 0..7 час, 8..16 слоти, 17 enable, 18 grid chg, 19 gen chg.
  - id: jup_write_tou_page
    mode: queued
    parameters:
      page: int
      idx: int
      newval: float
    then:
      - lambda: |-
          if (page < 4 || page > 6 || idx < -1 || idx > 19) return;
          // Час (idx 0..7) і прапорці (idx 17..19) пишемо тією сторінкою, у яку востаннє писали слоти
          int pg = page;
          if (idx >= 0 && (idx < 8 || idx >= 17)) pg = id(tou_page);
          if (pg < 4 || pg > 6) pg = 4;
          float t[8] = {id(tou_t1).state, id(tou_t2).state, id(tou_t3).state, id(tou_t4).state,
                        id(tou_t5).state, id(tou_t6).state, id(tou_t7).state, id(tou_t8).state};
          float s[9] = {id(tou_soc1).state, id(tou_soc2).state, id(tou_soc3).state,
                        id(tou_soc4).state, id(tou_soc5).state, id(tou_soc6).state,
                        id(tou_soc7).state, id(tou_soc8).state, id(tou_soc9).state};
          float v[9] = {id(tou_v1).state, id(tou_v2).state, id(tou_v3).state,
                        id(tou_v4).state, id(tou_v5).state, id(tou_v6).state,
                        id(tou_v7).state, id(tou_v8).state, id(tou_v9).state};
          float p[9] = {id(tou_p1).state, id(tou_p2).state, id(tou_p3).state,
                        id(tou_p4).state, id(tou_p5).state, id(tou_p6).state,
                        id(tou_p7).state, id(tou_p8).state, id(tou_p9).state};
          float flags[3] = {id(raw_tou_enable).state, id(raw_tou_grid_chg).state,
                            id(raw_tou_gen_chg).state};
          float *vals = (pg == 4) ? s : ((pg == 5) ? v : p);
          const float scale = (pg == 5) ? 0.01f : 1.0f;
          if (idx >= 0) {  // idx = -1: переписати сторінку як є (зміна типу TOU)
            if (idx < 8) t[idx] = newval;
            else if (idx < 17) vals[idx - 8] = newval;
            else flags[idx - 17] = newval;
          }

          uint16_t regs[21];
          regs[0] = pg;  // K0 = номер сторінки
          int prev = -1;
          for (int i = 0; i < 8; i++) {
            if (std::isnan(t[i])) {
              ESP_LOGW("jup", "TOU time %d not read yet - write skipped", i + 1);
              return;
            }
            int hhmm = (int) lroundf(t[i]);
            if (hhmm < 0 || hhmm > 2359 || (hhmm % 100) > 59) {
              ESP_LOGW("jup", "TOU time %d invalid (%d), expected HHMM - write skipped", i + 1, hhmm);
              return;
            }
            if (hhmm < prev) ESP_LOGW("jup", "TOU time %d (%04d) is earlier than previous one", i + 1, hhmm);
            prev = hhmm;
            regs[1 + i] = (uint16_t) hhmm;
          }
          for (int i = 0; i < 9; i++) {
            if (std::isnan(vals[i])) {
              ESP_LOGW("jup", "TOU pg %d slot %d not read yet - write skipped", pg, i + 1);
              return;
            }
            regs[9 + i] = (uint16_t) lroundf(vals[i] / scale);
          }
          for (int i = 0; i < 3; i++) {
            if (std::isnan(flags[i])) {
              ESP_LOGW("jup", "TOU flag %d not read yet - write skipped", i);
              return;
            }
            regs[18 + i] = (uint16_t) lroundf(flags[i]);
          }
          ESP_LOGI("jup", "Writing TOU pg %d: idx %d = %.2f", pg, idx, newval);
          id(jup_dc_writer).write_multiple_registers(5000, regs);
          if (idx >= 8 && idx < 17) id(tou_page) = pg;  // запис слота вибирає режим TOU (SOC / Voltage / Power)
          if (idx >= 0 && idx < 8) {
            sensor::Sensor *ts[8] = {id(tou_t1), id(tou_t2), id(tou_t3), id(tou_t4),
                                     id(tou_t5), id(tou_t6), id(tou_t7), id(tou_t8)};
            ts[idx]->publish_state(newval);
          }
          if (idx == 17) id(raw_tou_enable).publish_state(newval);
          else if (idx == 18) id(raw_tou_grid_chg).publish_state(newval);
          else if (idx == 19) id(raw_tou_gen_chg).publish_state(newval);


  # ---- Сторінка параметрів №7: мережа (напруга/частота мережі й генератора, CT) ----
  # K0=7, K1..K14 одним записом у 5000..5014:
  #   K1=642 номінальна напруга (0.1В), K2=643 номінальна частота (0.01Гц), K3=644 макс. струм (0.01А),
  #   K4=645 Uмереж.макс, K5=646 Uмереж.мін (0.1В), K6=647 Fмереж.макс, K7=648 Fмереж.мін (0.01Гц),
  #   K8=649 Fген.макс, K9=650 Fген.мін (0.01Гц), K10=652 Uген.макс, K11=653 Uген.мін (0.1В),
  #   K12=2733 слово керування мережею (передаємо як є), K13=2735 макс. потужність мережі (0.1кВт),
  #   K14=708 коефіцієнт зовнішнього CT.
  # УВАГА: ці регістри лежать у блоці інвертора, а сторінка пишеться через jup_dc_writer (як сторінки 3..6).
  # Якщо запис не проходить - спробуйте jup_inv_writer.
  - id: jup_write_ac_page
    mode: queued
    parameters:
      idx: int
      newval: float
    then:
      - lambda: |-
          static const float scale[14] = {0.1f, 0.01f, 0.01f, 0.1f, 0.1f, 0.01f, 0.01f,
                                          0.01f, 0.01f, 0.1f, 0.1f, 1.0f, 0.1f, 1.0f};
          if (idx < 0 || idx > 13 || std::isnan(newval)) return;
          float cur[14] = {
            id(p7_inv_v_rated).state, id(p7_inv_hz_rated).state, id(p7_ongrid_a_max).state,
            id(p7_grid_v_max).state, id(p7_grid_v_min).state, id(p7_grid_hz_max).state,
            id(p7_grid_hz_min).state, id(p7_gen_hz_max).state, id(p7_gen_hz_min).state,
            id(p7_gen_v_max).state, id(p7_gen_v_min).state,
            id(raw_grid_ctrl).state, id(grid_max_power_kw).state, id(p7_ct_ratio).state
          };
          cur[idx] = newval;
          uint16_t regs[15];
          regs[0] = 7;  // K0 = номер сторінки
          for (int i = 0; i < 14; i++) {
            if (std::isnan(cur[i])) {
              ESP_LOGW("jup", "Page 7 not fully read yet (param %d) - write skipped", i + 1);
              return;
            }
            regs[i + 1] = (uint16_t) lroundf(cur[i] / scale[i]);
          }
          ESP_LOGI("jup", "Writing page 7: K%d = %.2f", idx + 1, newval);
          id(jup_dc_writer).write_multiple_registers(5000, regs);

  # ---- Сторінка параметрів №8: порт генератора / Smart Load / AC Couple ----
  # K0=8, K1..K15 одним записом у 5000..5015:
  #   K1=701 тип порту, K2=702 режим Smart Load (0x05 / 0x50 / 0x55), K3=705 режим AC Couple (5=VF, 0=PQ),
  #   K4=2736 макс. потужність генератора (0.1кВт, передаємо як є), K5=703 сигнал запуску генератора (0x5),
  #   K6=3547 SL старт SOC, K7=3548 SL стоп SOC, K8=3549 SL старт U (0.01В), K9=3550 SL стоп U (0.01В),
  #   K10=3551 SL старт PV (Вт), K11=3552 частота AC Couple (0.01Гц), K12=3553 AC старт SOC,
  #   K13=3554 AC стоп SOC, K14=3557 AC старт U (0.01В), K15=3558 AC стоп U (0.01В).
  - id: jup_write_gen_page
    mode: queued
    parameters:
      idx: int
      newval: float
    then:
      - lambda: |-
          static const float scale[15] = {1.0f, 1.0f, 1.0f, 0.1f, 1.0f, 1.0f, 1.0f, 0.01f,
                                          0.01f, 1.0f, 0.01f, 1.0f, 1.0f, 0.01f, 0.01f};
          if (idx < 0 || idx > 14 || std::isnan(newval)) return;
          float cur[15] = {
            id(raw_gen_port).state, id(raw_smart_mode).state, id(raw_gen_mode).state,
            id(gen_max_power_kw).state, id(raw_gen_sig).state,
            id(p8_sl_on_soc).state, id(p8_sl_off_soc).state, id(p8_sl_on_v).state,
            id(p8_sl_off_v).state, id(p8_sl_start_pw).state, id(p8_ac_freq).state,
            id(p8_ac_on_soc).state, id(p8_ac_off_soc).state, id(p8_ac_on_v).state,
            id(p8_ac_off_v).state
          };
          cur[idx] = newval;
          uint16_t regs[16];
          regs[0] = 8;  // K0 = номер сторінки
          for (int i = 0; i < 15; i++) {
            if (std::isnan(cur[i])) {
              ESP_LOGW("jup", "Page 8 not fully read yet (param %d) - write skipped", i + 1);
              return;
            }
            regs[i + 1] = (uint16_t) lroundf(cur[i] / scale[i]);
          }
          ESP_LOGI("jup", "Writing page 8: K%d = %.2f", idx + 1, newval);
          id(jup_dc_writer).write_multiple_registers(5000, regs);
          // оновлюємо сирі слова, щоб select/switch одразу показали нове значення
          if (idx == 0) id(raw_gen_port).publish_state(newval);
          else if (idx == 1) id(raw_smart_mode).publish_state(newval);
          else if (idx == 2) id(raw_gen_mode).publish_state(newval);
          else if (idx == 4) id(raw_gen_sig).publish_state(newval);

  # ---- Сторінка параметрів №1: батарея і ліміти PV ----
  # K0=1, K1..K10 одним записом у 5000..5010:
  #   K1=2642 Uбат.макс (0.01В), K2=2643 Uбат.мін (0.01В), K3=2644 макс. струм заряду (0.1А),
  #   K4=2645 макс. струм розряду (0.1А, ВІД'ЄМНЕ, INT16), K5=2646 ємність (Ач),
  #   K6=2647 PV1 Umax (0.1В), K7=2648 PV1 Imax (0.01А), K8=2649 PV2 Umax (0.1В), K9=2650 PV2 Imax (0.01А),
  #   K10=2652 тип батареї (0x0005 Lithium, 0x0000 Use Bat V, 0x0050 Use Bat %).
  - id: jup_write_batt_page
    mode: queued
    parameters:
      idx: int
      newval: float
    then:
      - lambda: |-
          static const float scale[10] = {0.01f, 0.01f, 0.1f, 0.1f, 1.0f, 0.1f, 0.01f, 0.1f, 0.01f, 1.0f};
          if (idx < 0 || idx > 9 || std::isnan(newval)) return;
          float cur[10] = {
            id(p1_bat_v_max).state, id(p1_bat_v_min).state, id(p1_bat_chg_a).state,
            id(p1_bat_dis_a).state, id(p1_bat_cap).state, id(p1_pv1_v).state,
            id(p1_pv1_a).state, id(p1_pv2_v).state, id(p1_pv2_a).state, id(raw_bat_mode).state
          };
          cur[idx] = newval;
          uint16_t regs[11];
          regs[0] = 1;  // K0 = номер сторінки
          for (int i = 0; i < 10; i++) {
            if (std::isnan(cur[i])) {
              ESP_LOGW("jup", "Page 1 not fully read yet (param %d) - write skipped", i + 1);
              return;
            }
            regs[i + 1] = (uint16_t) (int16_t) lroundf(cur[i] / scale[i]);
          }
          ESP_LOGI("jup", "Writing page 1: K%d = %.2f", idx + 1, newval);
          id(jup_dc_writer).write_multiple_registers(5000, regs);
          if (idx == 9) id(raw_bat_mode).publish_state(newval);



# ===========================================================================
#  CONTROLS
# ===========================================================================
button:
  # Регістр 15, Table 2-2: bit1..bit0 = 1 -> інвертор ON, 2 -> інвертор OFF
  - platform: template
    name: "Inverter ON"
    icon: mdi:power
    on_press:
      - modbus_client.write_multiple_registers:
          address: ${inverter_address}
          start_address: 15
          values: [0x0001]

  # УВАГА: вимикає вихід інвертора (навантаження залишиться без живлення від нього)
  - platform: template
    name: "Inverter OFF"
    icon: mdi:power-off
    on_press:
      - modbus_client.write_multiple_registers:
          address: ${inverter_address}
          start_address: 15
          values: [0x0002]

  # Синхронізація годинника інвертора з Home Assistant (регістри 655..661).
  # Дні тижня: 1=Пн ... 7=Нд (припущення, у документації не уточнено).
  - platform: template
    name: "Sync Inverter Clock"
    icon: mdi:clock-check-outline
    entity_category: config
    on_press:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            ESP_LOGW("jup", "Time not synced from Home Assistant yet");
            return;
          }
          uint16_t regs[7] = {
            (uint16_t) (now.year % 100), (uint16_t) now.month,
            (uint16_t) ((now.day_of_week + 5) % 7 + 1), (uint16_t) now.day_of_month,
            (uint16_t) now.hour, (uint16_t) now.minute, (uint16_t) now.second
          };
          ESP_LOGI("jup", "Setting inverter clock %02d-%02d-%02d %02d:%02d:%02d",
                   now.year % 100, now.month, now.day_of_month, now.hour, now.minute, now.second);
          id(jup_inv_writer).write_multiple_registers(655, regs);

switch:
  # Слово 2732: 0xXXX5 = заряд від генератора, 0xXX5X = battery first
  # Слово 2733: 0xXXX5 = заряд від мережі,     0xX1XX = AC peak shaving
  - platform: template
    name: "Grid Charging"
    icon: mdi:transmission-tower-import
    entity_category: config
    lambda: |-
      if (std::isnan(id(raw_grid_ctrl).state)) return {};
      return (((uint16_t) id(raw_grid_ctrl).state) & 0x000F) == 0x0005;
    turn_on_action:
      - script.execute:
          id: jup_write_ctrl_word
          addr: 2733
          mask: 15
          value: 5
    turn_off_action:
      - script.execute:
          id: jup_write_ctrl_word
          addr: 2733
          mask: 15
          value: 0

  - platform: template
    name: "Generator Charging"
    icon: mdi:engine
    entity_category: config
    lambda: |-
      if (std::isnan(id(raw_gen_ctrl).state)) return {};
      return (((uint16_t) id(raw_gen_ctrl).state) & 0x000F) == 0x0005;
    turn_on_action:
      - script.execute:
          id: jup_write_ctrl_word
          addr: 2732
          mask: 15
          value: 5
    turn_off_action:
      - script.execute:
          id: jup_write_ctrl_word
          addr: 2732
          mask: 15
          value: 0

  - platform: template
    name: "Battery First"
    icon: mdi:battery-heart-variant
    entity_category: config
    lambda: |-
      if (std::isnan(id(raw_gen_ctrl).state)) return {};
      return (((uint16_t) id(raw_gen_ctrl).state) & 0x00F0) == 0x0050;
    turn_on_action:
      - script.execute:
          id: jup_write_ctrl_word
          addr: 2732
          mask: 240
          value: 80
    turn_off_action:
      - script.execute:
          id: jup_write_ctrl_word
          addr: 2732
          mask: 240
          value: 0

  - platform: template
    name: "AC Peak Shaving"
    icon: mdi:chart-bell-curve-cumulative
    entity_category: config
    lambda: |-
      if (std::isnan(id(raw_grid_ctrl).state)) return {};
      return (((uint16_t) id(raw_grid_ctrl).state) & 0x0F00) == 0x0100;
    turn_on_action:
      - script.execute:
          id: jup_write_ctrl_word
          addr: 2733
          mask: 3840
          value: 256
    turn_off_action:
      - script.execute:
          id: jup_write_ctrl_word
          addr: 2733
          mask: 3840
          value: 0


  # ---- Time of Use: головний вимикач і дозволи заряду за розкладом ----
  # (прапорці записуються разом зі сторінкою 4 (SOC); значення слотів лишаються поточні)
  - platform: template
    name: "Time of Use"
    icon: mdi:calendar-clock
    entity_category: config
    lambda: |-
      if (std::isnan(id(raw_tou_enable).state)) return {};
      return ((uint16_t) id(raw_tou_enable).state) == 5;
    turn_on_action:
      - script.execute:
          id: jup_write_tou_page
          page: 4
          idx: 17
          newval: 5
    turn_off_action:
      - script.execute:
          id: jup_write_tou_page
          page: 4
          idx: 17
          newval: 0

  # ---- Дозволи заряду для кожного з 9 слотів (як галочки Grid Chg En / Gen Chg En в додатку) ----
  # Регістри 2677 (мережа) і 2678 (генератор): біт 0..8 = слот 1..9.
  - platform: template
    name: "TOU Grid Charge Slot 1"
    icon: mdi:transmission-tower-import
    entity_category: config
    lambda: |-
      if (std::isnan(id(raw_tou_grid_chg).state)) return {};
      return (((uint16_t) id(raw_tou_grid_chg).state) & 0x0001) != 0;
    turn_on_action:
      - script.execute:
          id: jup_write_tou_page
          page: 4
          idx: 18
          newval: !lambda 'if (std::isnan(id(raw_tou_grid_chg).state)) return NAN; return (float) (((uint16_t) id(raw_tou_grid_chg).state) | 0x0001);'
    turn_off_action:
      - script.execute:
          id: jup_write_tou_page
          page: 4
          idx: 18
          newval: !lambda 'if (std::isnan(id(raw_tou_grid_chg).state)) return NAN; return (float) (((uint16_t) id(raw_tou_grid_chg).state) & 0xFFFE);'

  - platform: template
    name: "TOU Grid Charge Slot 2"
    icon: mdi:transmission-tower-import
    entity_category: config
    lambda: |-
      if (std::isnan(id(raw_tou_grid_chg).state)) return {};
      return (((uint16_t) id(raw_tou_grid_chg).state) & 0x0002) != 0;
    turn_on_action:
      - script.execute:
          id: jup_write_tou_page
          page: 4
          idx: 18
          newval: !lambda 'if (std::isnan(id(raw_tou_grid_chg).state)) return NAN; return (float) (((uint16_t) id(raw_tou_grid_chg).state) | 0x0002);'
    turn_off_action:
      - script.execute:
          id: jup_write_tou_page
          page: 4
          idx: 18
          newval: !lambda 'if (std::isnan(id(raw_tou_grid_chg).state)) return NAN; return (float) (((uint16_t) id(raw_tou_grid_chg).state) & 0xFFFD);'

  - platform: template
    name: "TOU Grid Charge Slot 3"
    icon: mdi:transmission-tower-import
    entity_category: config
    lambda: |-
      if (std::isnan(id(raw_tou_grid_chg).state)) return {};
      return (((uint16_t) id(raw_tou_grid_chg).state) & 0x0004) != 0;
    turn_on_action:
      - script.execute:
          id: jup_write_tou_page
          page: 4
          idx: 18
          newval: !lambda 'if (std::isnan(id(raw_tou_grid_chg).state)) return NAN; return (float) (((uint16_t) id(raw_tou_grid_chg).state) | 0x0004);'
    turn_off_action:
      - script.execute:
          id: jup_write_tou_page
