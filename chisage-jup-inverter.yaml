substitutions:
  name: jup-inverter
  friendly_name: "Chisage JUP"
  # Modbus-адреса блоку інвертора (за документацією - непарне число 0..63; зазвичай 1).
  inverter_address: "1"
  # Modbus-адреса DC-блоку (регістри 2000+, налаштування батареї).
  # Якщо відповідає та сама адреса - залиште як є. Якщо регістри 2000+ дають
  # таймаути, спробуйте парну адресу (наприклад "2") - у документації DC-блок парний.
  dc_address: "1"
  # Верхня межа слайдерів TOU Power Slot (Вт). За документацією діапазон 0..12000 (аркуш Parameter Group), у прикладі теж 12000.
  tou_max_power: "6000"
  # Мінімальна виміряна напруга (В), з якої мережа / генератор вважаються присутніми
  # (для сутностей Grid Faults, Generator Faults, Grid Present, Generator Present).
  ac_present_voltage: "10"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:

api:
  encryption:
    key: !secret jup_inverter__encryption_key
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: jup-6g2-inverte Fallback Hotspot
    password: !secret jup_inverter__ap_password
captive_portal:

uart:
  id: uart_rs485
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_rs485
  uart_id: uart_rs485
  flow_control_pin: GPIO17
  send_wait_time: 1000ms
  turnaround_time: 150ms

modbus_controller:
  # Швидкі дані інвертора (потужності, напруги, статуси)
  - id: inv_fast
    address: ${inverter_address}
    modbus_id: modbus_rs485
    update_interval: 10s
    offline_skip_updates: 5
  # Швидкі дані DC-блоку (аварії, стан)
  - id: dc_fast
    address: ${dc_address}
    modbus_id: modbus_rs485
    update_interval: 10s
    offline_skip_updates: 5
  # Повільні дані DC-блоку (лічильники енергії, налаштування)
  - id: dc_slow
    address: ${dc_address}
    modbus_id: modbus_rs485
    update_interval: 60s
    offline_skip_updates: 5
  # Time of Use: розклад (регістри 2669..2734) - змінюється рідко
  - id: dc_tou
    address: ${dc_address}
    modbus_id: modbus_rs485
    update_interval: 120s
    offline_skip_updates: 5
  # Годинник інвертора (регістри 655..661, блок інвертора)
  - id: inv_slow
    address: ${inverter_address}
    modbus_id: modbus_rs485
    update_interval: 60s
    offline_skip_updates: 5

# Writer-и для скриптів запису (lambda hook, лише запис)
modbus_client:
  - id: jup_inv_writer
    address: ${inverter_address}
  - id: jup_dc_writer
    address: ${dc_address}


# ===========================================================================
#  SENSORS
# ===========================================================================
# Остання сторінка Time of Use, у яку ви писали значення слотів (4 = SOC, 5 = Voltage, 6 = Power).
# Інвертор визначає режим TOU за номером останньої записаної сторінки, тому зміна часу чи
# дозволів заряду пишеться тією ж сторінкою і не перемикає режим. Окремого вибору "TOU Type" більше немає.
globals:
  - id: tou_page
    type: int
    restore_value: true
    initial_value: '4'

sensor:

  # ---- PV (сонячні панелі) ----
  - platform: modbus_controller
    modbus_controller_id: inv_fast
    name: "PV1 Voltage"
    address: 38
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: inv_fast
    name: "PV1 Current"
    address: 39
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
